name: Build iOS Dumper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git libtinfo5 rsync zstd unzip clang lld

      - name: Install Theos & Toolchain (Linux cross-compile for iOS)
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          # Скачиваем готовый LLVM/Clang тулчейн для iOS под Linux
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64.tar.lzma
          mkdir -p ~/theos/toolchain/linux/iphone
          tar --lzma -xf linux-ios-arm64.tar.lzma -C ~/theos/toolchain/linux/iphone/
          rm linux-ios-arm64.tar.lzma

          # Скачиваем SDK iOS
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Rootless DEB (Dopamine iOS 16+)
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Build Bare Dylib (for TrollStore / Sideloading)
        run: |
          export THEOS=~/theos
          make clean
          make FINALPACKAGE=1
          mkdir -p artifacts
          cp -r .theos/obj/debug/*.dylib artifacts/ 2>/dev/null || cp -r .theos/obj/*.dylib artifacts/ 2>/dev/null || find .theos -name "*.dylib" -exec cp {} artifacts/ \;

      - name: Upload DEB and Dylib
        uses: actions/upload-artifact@v4
        with:
          name: IOSDumper-Output
          path: |
            packages/*.deb
            artifacts/*.dylib
