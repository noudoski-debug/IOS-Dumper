name: Build iOS Dumper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ~/theos/sdks/ || true
          rm -rf sdks-master master.zip

      - name: Build Rootless DEB (Tweak + App for Dopamine)
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Build Standalone TrollStore IPA & Bare Dylib
        run: |
          export THEOS=~/theos
          make clean
          make FINALPACKAGE=1
          mkdir -p artifacts
          find .theos -name "*.dylib" -exec cp {} artifacts/ \;

          APP_DIR=$(find .theos -name "IOSDumper.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            echo "Packing app: $APP_DIR"
            
            # В Theos Info.plist обязательно копируется внутрь .app бандла
            cp -f app/Info.plist "$APP_DIR/Info.plist"
            
            # Подпись бинарника
            ldid -Sapp/entitlements.plist "$APP_DIR/IOSDumper" || true

            # Формирование структуры IPA
            rm -rf Payload
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            
            # Проверяем наличие Info.plist перед упаковкой
            ls -la Payload/IOSDumper.app/
            
            zip -qr artifacts/IOSDumper-TrollStore.ipa Payload
            rm -rf Payload
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IOSDumper-Output
          path: |
            packages/*.deb
            artifacts/*.dylib
            artifacts/*.ipa
